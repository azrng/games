<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>倒水谜题 - 游戏平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell" aria-label="倒水谜题">
        <header class="game-header">
            <div>
                <p class="eyebrow">Water Pour</p>
                <h1>倒水谜题</h1>
            </div>
            <div class="level-pill" aria-label="当前关卡">
                <span id="level-text">第 1 关</span>
            </div>
        </header>

        <section class="scoreboard" aria-label="本关状态">
            <article class="score-card">
                <span class="label">步数</span>
                <strong id="steps-text">0</strong>
            </article>
            <article class="score-card">
                <span class="label">最少步</span>
                <strong id="min-steps-text">0</strong>
            </article>
            <article class="score-card">
                <span class="label">本关最佳</span>
                <strong id="best-text">--</strong>
            </article>
        </section>

        <section class="goal-banner" aria-label="本关目标">
            <span class="goal-icon">🎯</span>
            <span class="goal-label">目标</span>
            <strong id="goal-text">量出 4L</strong>
        </section>

        <section class="board-section" aria-label="杯子区">
            <div id="cups" class="cups" aria-live="polite"></div>
        </section>

        <p id="status-text" class="status-text" aria-live="polite">点一个杯子选中它，再点另一个杯子倒水。</p>

        <section class="cmd-bar" aria-label="选中杯操作">
            <button id="fill-btn" class="cmd-btn cmd-fill" type="button" disabled>
                <span class="cmd-icon">🚰</span>
                <span class="cmd-name">装满</span>
            </button>
            <button id="empty-btn" class="cmd-btn cmd-empty" type="button" disabled>
                <span class="cmd-icon">🫗</span>
                <span class="cmd-name">倒光</span>
            </button>
        </section>

        <footer class="action-bar">
            <button id="undo-btn" class="ghost-btn" type="button">撤销</button>
            <button id="hint-btn" class="ghost-btn" type="button">提示<span id="hint-count">(3)</span></button>
            <button id="restart-btn" class="ghost-btn" type="button">重开本关</button>
        </footer>
        <footer class="action-bar action-bar-single">
            <button id="levels-btn" class="ghost-btn" type="button">关卡选择</button>
        </footer>
    </main>

    <section id="win-modal" class="overlay-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
            <p class="eyebrow">Level Clear</p>
            <h2 id="win-title">量出来啦！</h2>
            <p id="result-stars" class="stars" aria-label="星级评价">★★★</p>
            <div class="result-grid">
                <div>
                    <span class="label">本关步数</span>
                    <strong id="result-steps">0</strong>
                </div>
                <div>
                    <span class="label">最少步</span>
                    <strong id="result-min">0</strong>
                </div>
                <div>
                    <span class="label">历史最佳</span>
                    <strong id="result-best">--</strong>
                </div>
            </div>
            <div class="modal-actions">
                <button id="replay-btn" class="ghost-btn" type="button">再玩一次</button>
                <button id="next-btn" class="primary-btn" type="button">下一关</button>
            </div>
        </div>
    </section>

    <section id="level-modal" class="overlay-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="level-title">
            <p class="eyebrow">Levels</p>
            <h2 id="level-title">选择关卡</h2>
            <div id="level-grid" class="level-grid"></div>
            <div class="modal-actions">
                <button id="close-levels-btn" class="primary-btn" type="button">返回游戏</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="../js/game-back.js"></script>
</body>
</html>
