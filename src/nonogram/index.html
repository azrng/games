<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>数织 - 游戏平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell" aria-label="数织">
        <header class="game-header">
            <div>
                <p class="eyebrow">Nonogram</p>
                <h1>数织</h1>
            </div>
            <div class="level-pill" aria-label="当前关卡">
                <span id="level-text">5×5 · 第 1 关</span>
            </div>
        </header>

        <section class="scoreboard" aria-label="本局状态">
            <article class="score-card">
                <span class="label">用时</span>
                <strong id="timer-text">00:00</strong>
            </article>
            <article class="score-card">
                <span class="label">提示</span>
                <strong id="hints-text">(3)</strong>
            </article>
            <article class="score-card">
                <span class="label">本关最快</span>
                <strong id="best-text">--</strong>
            </article>
        </section>

        <section class="board-section" aria-label="数织棋盘">
            <div id="board" class="nono-board" aria-live="polite"></div>
        </section>

        <p class="hint-text">数字是每行每列连续填格的长度：点按三态切换（空→填→叉），右键或长按直接标叉。</p>

        <footer class="action-bar">
            <button id="undo-btn" class="ghost-btn" type="button">撤销</button>
            <button id="restart-btn" class="ghost-btn" type="button">重开</button>
            <button id="hint-btn" class="ghost-btn" type="button">提示<span id="hint-count">(3)</span></button>
            <button id="levels-btn" class="ghost-btn" type="button">关卡</button>
        </footer>
    </main>

    <section id="win-modal" class="overlay-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
            <p class="eyebrow">Picture Done</p>
            <h2 id="win-title">底图显现！</h2>
            <p id="result-stars" class="stars" aria-label="星级评价">★★★</p>
            <div class="result-grid">
                <div>
                    <span class="label">本关用时</span>
                    <strong id="result-time">00:00</strong>
                </div>
                <div>
                    <span class="label">历史最快</span>
                    <strong id="result-best">--</strong>
                </div>
                <div>
                    <span class="label">提示</span>
                    <strong id="result-hints">0</strong>
                </div>
            </div>
            <div class="modal-actions">
                <button id="replay-btn" class="ghost-btn" type="button">再玩一次</button>
                <button id="next-btn" class="primary-btn" type="button">下一关</button>
            </div>
        </div>
    </section>

    <section id="level-modal" class="overlay-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="level-title">
            <p class="eyebrow">Levels</p>
            <h2 id="level-title">选择关卡</h2>
            <div id="level-grid" class="level-grid"></div>
            <div class="modal-actions">
                <button id="close-levels-btn" class="primary-btn" type="button">返回游戏</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="../js/game-back.js"></script>
</body>
</html>
